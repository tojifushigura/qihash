name: Portability

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-unix:
    name: CMake ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cmake --config Release

      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure

  cmake-windows:
    name: CMake Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cmake --config Release

      - name: Test
        run: ctest --test-dir build-cmake --output-on-failure -C Release
